[project]
site_name = "Learn rtd-acquire"
site_url = "https://gregrr.github.io/rtd-acquire/"
site_description = "Approachable rtd-acquire documentation for RTD resistance acquisition, hardware interfaces, diagnostics, simulation, and integration."
site_author = "Greg Roe"
docs_dir = "learn"
site_dir = "site"
repo_url = "https://github.com/GregRR/rtd-acquire"
repo_name = "GregRR/rtd-acquire"
edit_uri = "edit/main/learn/"
copyright = "Copyright &copy; 2026 Greg Roe"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Start Here" = "start-here.md" },
  { "Documentation" = [
    { "Documentation home" = "documentation/index.md" },
    { "Using rtd-acquire" = [
      { "Overview" = "documentation/using/index.md" },
      { "Installation" = "documentation/using/installation.md" },
      { "Measurement results" = "documentation/using/measurement-results.md" },
      { "Reading devices" = "documentation/using/reading-devices.md" },
      { "Errors and status" = "documentation/using/errors-status.md" },
    ] },
    { "Hardware & acquisition" = [
      { "Overview" = "documentation/hardware/index.md" },
      { "MAX31865" = "documentation/hardware/max31865.md" },
      { "Raspberry Pi / Linux SPI" = "documentation/hardware/raspberry-pi.md" },
      { "The acquisition boundary" = "documentation/hardware/acquisition-boundary.md" },
    ] },
    { "Measurement & diagnostics" = [
      { "Overview" = "documentation/measurement-diagnostics/index.md" },
      { "Diagnostics" = "documentation/measurement-diagnostics/diagnostics.md" },
      { "Native evidence" = "documentation/measurement-diagnostics/native-evidence.md" },
      { "Resistance uncertainty" = "documentation/measurement-diagnostics/uncertainty.md" },
    ] },
    { "Simulation & testing" = [
      { "Overview" = "documentation/simulation-testing/index.md" },
      { "Simulated acquisition" = "documentation/simulation-testing/simulation.md" },
      { "MAX31865 SPI emulator" = "documentation/simulation-testing/max31865-emulator.md" },
    ] },
    { "Integration" = [
      { "Overview" = "documentation/integration/index.md" },
      { "rtd-sensor" = "documentation/integration/rtd-sensor.md" },
      { "Implementing acquisition devices" = "documentation/integration/acquisition-devices.md" },
      { "Hardware integration" = "documentation/integration/hardware-integration.md" },
    ] },
  ] },
  { "Advanced" = [
    { "Advanced home" = "advanced/index.md" },
    { "Understanding conformance" = "advanced/conformance.md" },
    { "Conformance artifacts" = "advanced/conformance-artifacts.md" },
    { "Portable C11" = "advanced/c11.md" },
    { "Cross-language & embedded" = "advanced/cross-language-embedded.md" },
    { "Hardware validation" = "advanced/hardware-validation.md" },
  ] },
  { "API Reference" = [
    { "API home" = "api/index.md" },
    { "Python API" = [
      { "Core contracts" = "api/core.md" },
      { "max31865" = "api/max31865.md" },
      { "simulation" = "api/simulation.md" },
      { "transports" = "api/transports.md" },
    ] },
    { "Portable C API" = [
      { "Overview" = "api/c/index.md" },
      { "Core result contracts" = "api/c/core.md" },
      { "HAL interfaces" = "api/c/hal.md" },
      { "MAX31865" = "api/c/max31865.md" },
      { "Arduino AVR / HERO" = "api/c/arduino-avr.md" },
    ] },
  ] },
  { "Project" = "project/index.md" },
]

[project.theme]
features = [
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.path",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.zensical.extensions.glightbox]
auto = true

[project.validation]
invalid_links = true
invalid_link_anchors = true
